name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configure Firebase
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON || vars.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo "Firebase config not supplied; continuing with the local/CI-safe build."
            exit 0
          fi
          mkdir -p app
          if printf '%s' "$GOOGLE_SERVICES_JSON" | python3 -m json.tool >/dev/null 2>&1; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
          fi
          python3 -m json.tool app/google-services.json >/dev/null

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Install emulator system image
        run: sdkmanager "emulator" "platform-tools" "system-images;android-35;google_apis;x86_64"

      - name: Create emulator
        run: echo "no" | avdmanager create avd -n ci-api35 -k "system-images;android-35;google_apis;x86_64" --force

      - name: Start emulator
        run: |
          nohup emulator -avd ci-api35 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect > /tmp/emulator.log 2>&1 &
          adb wait-for-device
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          boot_completed=""
          for i in {1..60}; do
            boot_completed=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$boot_completed" = "1" ]; then break; fi
            sleep 2
          done
          test "$boot_completed" = "1"

      - name: Run instrumentation tests
        run: gradle :app:connectedDebugAndroidTest --stacktrace
